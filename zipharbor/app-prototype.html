<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f5fa">
<title>ZipKit · iOS 交互原型</title>
<style>
:root{
  --bg:#f3f5fa;--paper:#ffffff;--soft:#f6f7fb;--ink:#171c2e;--muted:#8990a3;--line:#edf0f5;
  --blue:#5669ee;--blue-dark:#4354d3;--blue-soft:#eef0ff;--green:#19896b;--green-soft:#e8f7f1;
  --orange:#d98036;--orange-soft:#fff3e8;--red:#cc5262;--red-soft:#fff0f1;
  --shadow:0 32px 90px rgba(33,44,89,.16),0 8px 24px rgba(33,44,89,.08);
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 18% 8%,#e7ebff 0,transparent 30%),radial-gradient(ellipse at 84% 80%,#e7f4f2 0,transparent 28%),var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
.stage{min-height:100vh;display:grid;grid-template-columns:minmax(320px,480px) 402px minmax(220px,300px);gap:56px;align-items:center;justify-content:center;padding:44px 36px}
.intro{max-width:440px;align-self:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;border:1px solid #dfe3f1;background:#ffffff9c;border-radius:999px;padding:8px 12px;color:#606985;font-size:12px;font-weight:650;letter-spacing:.02em}
.eyebrow i{width:7px;height:7px;background:#42b68c;border-radius:50%;box-shadow:0 0 0 4px #e5f7ef}
.intro h1{font-size:48px;line-height:1.12;letter-spacing:-1.8px;margin:22px 0 14px;font-weight:760}
.intro h1 span{color:var(--blue)}
.intro p{font-size:16px;line-height:1.8;color:#737b90;margin:0;max-width:405px}
.intro-rule{height:1px;background:#e0e4ee;margin:28px 0 22px}
.flow-title{font-size:12px;font-weight:700;color:#9aa1b3;text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px}
.flow-list{display:grid;gap:9px}
.flow-item{display:flex;align-items:center;gap:12px;padding:12px 13px;background:#ffffffa8;border:1px solid #e9ebf2;border-radius:14px;font-size:13px;color:#525a70}
.flow-num{display:grid;place-items:center;width:24px;height:24px;border-radius:9px;background:#eef0ff;color:var(--blue);font-weight:750;font-size:11px;flex:none}
.intro-note{font-size:12px!important;color:#a0a6b5!important;margin-top:20px!important}
.device{width:402px;height:min(860px,calc(100vh - 56px));min-height:650px;border:8px solid #1d2230;border-radius:48px;background:#f8f9fc;box-shadow:var(--shadow);position:relative;overflow:hidden;isolation:isolate}
.dynamic-island{position:absolute;z-index:15;top:9px;left:50%;transform:translateX(-50%);height:25px;width:110px;background:#10131b;border-radius:18px;pointer-events:none}
.app{height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
.statusbar{height:43px;min-height:43px;padding:0 25px;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:720;letter-spacing:.02em;color:var(--ink);padding-top:5px}
.status-right{display:flex;align-items:center;gap:6px}
.signal{display:flex;align-items:flex-end;gap:2px;height:12px}
.signal b{width:3px;border-radius:3px;background:currentColor;display:block}
.signal b:nth-child(1){height:4px}.signal b:nth-child(2){height:6px}.signal b:nth-child(3){height:9px}.signal b:nth-child(4){height:11px}
.battery{width:19px;height:10px;border:1.4px solid currentColor;border-radius:3px;padding:1px;position:relative}
.battery:after{content:"";position:absolute;right:-3px;top:2.5px;width:2px;height:4px;border-radius:0 2px 2px 0;background:currentColor}
.battery i{display:block;width:75%;height:100%;border-radius:1px;background:currentColor}
.app-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding-bottom:14px}
.app-scroll::-webkit-scrollbar{display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:9px 22px 16px}
.top-title{font-size:25px;font-weight:760;letter-spacing:-.7px}
.top-sub{font-size:12px;color:var(--muted);margin-top:3px}
.top-actions{display:flex;align-items:center;gap:9px}
.icon-btn{width:39px;height:39px;border:1px solid var(--line);background:var(--paper);color:#626b82;border-radius:14px;display:grid;place-items:center;transition:.18s}
.icon-btn:hover{border-color:#cdd2ff;color:var(--blue);transform:translateY(-1px)}
svg{display:block}
.section{padding:0 20px;margin-top:15px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.section-title{font-size:14px;font-weight:720;letter-spacing:-.15px}
.section-link{border:0;background:transparent;color:var(--blue);font-size:12px;font-weight:650;padding:4px 0}
.welcome-card{margin:0 20px;padding:17px;border-radius:22px;background:linear-gradient(135deg,#596cf1 0%,#737ef4 56%,#8a90f4 100%);color:white;position:relative;overflow:hidden;box-shadow:0 12px 24px rgba(86,105,238,.2)}
.welcome-card:after{content:"";position:absolute;width:178px;height:178px;border-radius:50%;right:-46px;top:-90px;background:#ffffff13;border:1px solid #ffffff20}
.welcome-kicker{font-size:11px;color:#e1e5ff;letter-spacing:.05em;display:flex;align-items:center;gap:7px}
.welcome-kicker .dot{width:6px;height:6px;background:#a9f0ce;border-radius:50%}
.welcome-title{font-size:20px;font-weight:730;margin:11px 0 4px;letter-spacing:-.4px}
.welcome-copy{font-size:12px;line-height:1.55;color:#e7e9ff;max-width:255px}
.welcome-foot{margin-top:15px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.privacy-pill{font-size:10px;color:#f1f2ff;display:flex;align-items:center;gap:5px}
.primary-small{border:0;border-radius:11px;padding:9px 12px;background:white;color:#4f62df;font-size:11px;font-weight:730;box-shadow:0 3px 8px #33333312}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick-card{border:1px solid var(--line);border-radius:18px;background:var(--paper);padding:14px 13px;display:flex;align-items:center;gap:11px;text-align:left;color:var(--ink);box-shadow:0 3px 12px #27345a05;transition:.18s;min-height:72px}
.quick-card:hover{border-color:#d6d9ff;transform:translateY(-2px);box-shadow:0 7px 18px #27345a0c}
.quick-icon{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;flex:none}
.quick-icon.purple{background:#eef0ff;color:#596bee}.quick-icon.mint{background:#e8f7f1;color:#1a9871}
.quick-label{display:block;font-size:13px;font-weight:720}
.quick-caption{display:block;font-size:10px;color:var(--muted);margin-top:4px}
.list-card{border:1px solid var(--line);background:var(--paper);border-radius:18px;overflow:hidden}
.file-row{display:flex;align-items:center;gap:11px;padding:12px 12px;border-bottom:1px solid var(--line);min-height:67px;cursor:pointer;transition:background .15s}
.file-row:last-child{border-bottom:0}
.file-row:hover{background:var(--soft)}
.file-icon{height:40px;width:40px;flex:none;border-radius:13px;display:grid;place-items:center}
.file-icon.zip{background:#eef0ff;color:#586be9}.file-icon.folder{background:#fff3dd;color:#d89427}.file-icon.pdf{background:#fff0f1;color:#d95b67}.file-icon.image{background:#eaf5ff;color:#4689ca}.file-icon.text{background:#f2efff;color:#8065c8}.file-icon.archive{background:#e8f7f1;color:#21896e}
.file-main{min-width:0;flex:1}
.file-name{font-size:12px;font-weight:680;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-meta{font-size:10px;color:var(--muted);margin-top:5px;display:flex;gap:6px;align-items:center}
.file-meta .sep{color:#ccd0da}
.row-trailing{display:flex;flex-direction:column;align-items:flex-end;gap:7px;color:#a0a7b6;font-size:10px;white-space:nowrap}
.status-chip{font-size:9px;padding:4px 7px;border-radius:999px;background:var(--green-soft);color:var(--green);font-weight:700}
.status-chip.running{background:var(--blue-soft);color:var(--blue)}
.folder-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.location-card{border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:13px;display:flex;align-items:center;gap:10px;min-height:62px;text-align:left;color:var(--ink)}
.location-card:hover{border-color:#d8dcff}
.location-card .loc-icon{height:34px;width:34px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:#6b7390}
.loc-name{font-size:11px;font-weight:680}.loc-sub{font-size:9px;color:var(--muted);margin-top:4px}
.bottom-nav{height:75px;min-height:75px;border-top:1px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:space-around;padding:3px 16px calc(5px + env(safe-area-inset-bottom));z-index:4}
.nav-item{border:0;background:none;color:#a0a6b6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:72px;padding:5px 12px}
.nav-item span{font-size:9px;font-weight:620}
.nav-item.active{color:var(--blue)}
.nav-item.active .nav-icon-wrap{background:var(--blue-soft)}
.nav-icon-wrap{width:35px;height:28px;border-radius:10px;display:grid;place-items:center}
.back-title{display:flex;align-items:center;gap:10px}
.back-button{border:0;background:var(--paper);color:var(--blue);width:35px;height:35px;border-radius:12px;display:grid;place-items:center}
.detail-summary{margin:0 20px;background:linear-gradient(135deg,#fff 0%,#fbfbff 100%);border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:0 4px 16px #27345a07}
.summary-top{display:flex;align-items:center;gap:12px}
.summary-icon{width:49px;height:49px;border-radius:16px;background:#eef0ff;color:var(--blue);display:grid;place-items:center}
.summary-name{font-size:15px;font-weight:740;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.summary-tag{font-size:10px;color:var(--muted);margin-top:5px}
.summary-stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.stat{text-align:center;border-right:1px solid var(--line)}
.stat:last-child{border:0}
.stat b{font-size:12px;display:block}
.stat span{font-size:9px;color:var(--muted);display:block;margin-top:4px}
.detail-actions{display:flex;gap:9px;margin:12px 20px 0}
.action-primary{flex:1;border:0;border-radius:14px;background:var(--blue);color:white;height:44px;font-size:12px;font-weight:730;display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:0 5px 12px #5669ee33}
.action-primary:hover{background:var(--blue-dark)}
.action-secondary{border:1px solid var(--line);background:var(--paper);color:#626b82;border-radius:14px;height:44px;padding:0 14px;font-size:12px;font-weight:680;display:flex;align-items:center;gap:7px}
.action-secondary.selected{background:var(--blue-soft);color:var(--blue);border-color:#d9ddff}
.searchbar{display:flex;align-items:center;gap:8px;padding:0 11px;height:37px;background:var(--soft);border-radius:12px;color:#9ba2b1}
.searchbar input{border:0;background:transparent;outline:0;color:var(--ink);width:100%;font-size:11px}
.filter-tabs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin-top:10px}
.filter-tabs::-webkit-scrollbar{display:none}
.filter-tab{border:1px solid var(--line);background:var(--paper);color:#81889a;border-radius:999px;padding:6px 10px;font-size:10px;white-space:nowrap}
.filter-tab.active{background:var(--blue-soft);color:var(--blue);border-color:#dfe2ff;font-weight:700}
.entry-list{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.entry-row{display:flex;align-items:center;gap:9px;padding:11px 10px;border-bottom:1px solid var(--line);min-height:58px}
.entry-row:last-child{border:0}
.entry-select{width:18px;height:18px;border:1.5px solid #d4d8e2;border-radius:6px;display:grid;place-items:center;flex:none;color:white}
.entry-select.on{background:var(--blue);border-color:var(--blue)}
.entry-type{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;flex:none}
.entry-type.folder{background:#fff4de;color:#d5942c}.entry-type.pdf{background:#fff0f1;color:#d95b67}.entry-type.img{background:#eaf5ff;color:#4689ca}.entry-type.txt{background:#f2efff;color:#8065c8}.entry-type.zip{background:#eef0ff;color:#586be9}
.entry-info{min-width:0;flex:1}
.entry-name{font-size:11px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry-sub{font-size:9px;color:var(--muted);margin-top:4px}
.entry-size{font-size:9px;color:#9ba2b1;white-space:nowrap}
.path-pill{display:flex;align-items:center;gap:5px;font-size:10px;color:#7e8699;background:var(--soft);border-radius:10px;padding:8px 10px;margin-top:11px}
.sticky-action{padding:10px 20px 12px;background:linear-gradient(180deg,#f7f8fc00,#f7f8fc 22%);position:absolute;bottom:75px;left:0;right:0;z-index:3}
.sticky-action button{width:100%;height:45px}
.create-progress{height:5px;border-radius:9px;background:#e9ebf4;overflow:hidden;margin-top:12px}
.create-progress span{display:block;height:100%;background:var(--blue);border-radius:9px;transition:width .3s}
.create-step{font-size:10px;color:var(--muted);margin-top:7px;text-align:center}
.selection-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid #e1e4ff;background:#f6f7ff;border-radius:13px;margin-bottom:10px;font-size:11px;color:#626b82}
.selection-bar b{color:var(--blue)}
.form-card{border:1px solid var(--line);background:var(--paper);border-radius:17px;padding:14px;margin-bottom:10px}
.form-label{font-size:10px;color:var(--muted);font-weight:650;margin-bottom:9px}
.text-input{width:100%;height:41px;border:1px solid var(--line);background:var(--soft);border-radius:11px;padding:0 11px;outline:none;color:var(--ink);font-size:12px}
.text-input:focus{border-color:#bfc6ff;box-shadow:0 0 0 3px #eef0ff}
.option-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:11px}
.option-row:first-of-type{border-top:0;padding-top:0}
.option-label{font-weight:650}.option-sub{font-size:9px;color:var(--muted);margin-top:3px}
.segment{display:flex;padding:3px;background:var(--soft);border-radius:10px;gap:2px}
.segment button{border:0;background:transparent;border-radius:8px;padding:6px 9px;color:#858c9d;font-size:9px}
.segment button.active{background:var(--paper);color:var(--blue);font-weight:700;box-shadow:0 1px 4px #232c4c14}
.switch{width:37px;height:22px;border:0;border-radius:99px;background:#d8dbe4;padding:3px;transition:.2s}
.switch:after{content:"";display:block;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0002;transition:.2s}
.switch.on{background:var(--blue)}
.switch.on:after{transform:translateX(15px)}
.full-button{height:46px;width:100%;background:var(--blue);color:white;border:0;border-radius:14px;font-weight:720;font-size:12px;box-shadow:0 5px 12px #5669ee2e}
.full-button:disabled{opacity:.42;cursor:not-allowed}
.task-card{border:1px solid var(--line);background:var(--paper);border-radius:17px;padding:13px;margin-bottom:10px}
.task-top{display:flex;align-items:center;gap:10px}
.task-icon{width:39px;height:39px;border-radius:13px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none}
.task-name{font-size:12px;font-weight:700}
.task-caption{font-size:9px;color:var(--muted);margin-top:4px}
.task-actions{margin-left:auto;display:flex;gap:5px}
.small-icon-btn{width:30px;height:30px;border:1px solid var(--line);background:var(--paper);color:#7e8699;border-radius:10px;display:grid;place-items:center}
.task-line{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:12px}
.task-card .create-progress{margin-top:7px}
.task-done{margin-top:10px;background:var(--green-soft);border-radius:10px;color:var(--green);padding:8px 9px;font-size:9px;display:flex;align-items:center;gap:6px}
.task-error{margin-top:10px;background:var(--orange-soft);border-radius:10px;color:#a66b2e;padding:9px;font-size:9px;line-height:1.5}
.tab-switch{display:flex;gap:5px;background:var(--soft);border-radius:12px;padding:4px;margin:0 20px 13px}
.tab-switch button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 5px;color:#9299a9;font-size:10px;font-weight:650}
.tab-switch button.active{background:var(--paper);color:var(--ink);box-shadow:0 1px 4px #27345a10}
.settings-group{margin:15px 20px 0}
.settings-label{font-size:10px;color:#a0a6b5;font-weight:700;margin:0 0 8px 4px}
.settings-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.settings-row{min-height:54px;display:flex;align-items:center;gap:11px;padding:9px 12px;border-bottom:1px solid var(--line)}
.settings-row:last-child{border:0}
.settings-icon{width:32px;height:32px;border-radius:11px;background:var(--soft);color:#6e7893;display:grid;place-items:center}
.settings-copy{flex:1;min-width:0}
.settings-name{font-size:11px;font-weight:680}
.settings-hint{font-size:9px;color:var(--muted);margin-top:3px}
.settings-value{font-size:10px;color:#9299a9}
.switch-label{border:0;background:transparent;padding:0}
.bottom-note{text-align:center;color:#a1a7b6;font-size:9px;padding:22px 20px 8px;line-height:1.6}
.modal-backdrop{position:absolute;inset:0;background:#141a2c70;z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fadein .16s ease}
.sheet{width:100%;max-height:84%;overflow:auto;background:var(--paper);border-radius:23px 23px 0 0;padding:10px 20px calc(21px + env(safe-area-inset-bottom));box-shadow:0 -12px 50px #11182c24;animation:slideup .23s cubic-bezier(.2,.75,.2,1)}
.sheet-handle{width:37px;height:4px;background:#dfe2e9;border-radius:5px;margin:0 auto 16px}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:15px}
.sheet-title{font-size:17px;font-weight:740}
.sheet-subtitle{font-size:10px;color:var(--muted);margin-top:5px}
.sheet-close{border:0;background:var(--soft);color:#767f94;width:29px;height:29px;border-radius:10px;display:grid;place-items:center}
.destination-option{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer}
.destination-option.active{border-color:#cdd2ff;background:#f8f8ff}
.radio{width:17px;height:17px;border:1.5px solid #cdd2dc;border-radius:50%;display:grid;place-items:center}
.destination-option.active .radio{border-color:var(--blue)}
.destination-option.active .radio:after{content:"";width:9px;height:9px;background:var(--blue);border-radius:50%}
.dest-title{font-size:11px;font-weight:680}.dest-sub{font-size:9px;color:var(--muted);margin-top:4px}
.sheet-options{margin:13px 0}
.sheet-option{display:flex;align-items:center;justify-content:space-between;padding:10px 2px;font-size:10px;border-top:1px solid var(--line)}
.toast{position:absolute;bottom:91px;left:50%;transform:translateX(-50%) translateY(12px);z-index:30;opacity:0;background:#22283a;color:#fff;border-radius:12px;padding:10px 13px;font-size:10px;white-space:nowrap;box-shadow:0 7px 24px #1114;transition:.22s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty-state{text-align:center;padding:34px 20px;color:var(--muted)}
.empty-icon{width:54px;height:54px;border-radius:19px;margin:0 auto 12px;background:var(--soft);display:grid;place-items:center;color:#9aa1b4}
.empty-state b{display:block;color:var(--ink);font-size:12px;margin-bottom:5px}
.empty-state span{font-size:10px}
.side-panel{width:270px;align-self:center}
.side-card{background:#ffffffad;border:1px solid #e6e9f1;border-radius:20px;padding:17px;margin-bottom:12px}
.side-kicker{font-size:10px;color:#9aa1b3;font-weight:700;letter-spacing:.08em}
.side-card h3{font-size:14px;margin:7px 0 12px;letter-spacing:-.2px}
.demo-list{display:grid;gap:7px}
.demo-action{width:100%;display:flex;align-items:center;gap:9px;border:1px solid #e9ebf2;background:#fff;border-radius:12px;padding:10px;text-align:left;color:#5f687e;font-size:11px;transition:.15s}
.demo-action:hover{border-color:#cdd2ff;color:var(--blue)}
.demo-action svg{color:var(--blue)}
.side-foot{color:#a3a9b7;font-size:10px;line-height:1.6;padding:0 3px}
.toast-global{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#20263a;color:#fff;padding:11px 15px;border-radius:14px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:99}
.toast-global.show{opacity:1}

    else if(a==='toggle-entry'){let entry=state.entries.find(function(e){return e.name===n});if(entry)entry.selected=!entry.selected;render()}
    else if(a==='select-all'){let all=state.entries.every(function(e){return e.selected});state.entries.forEach(function(e){e.selected=!all});render()}
    else if(a==='filter-archive'){state.archiveFilter=n;render()}
    else if(a==='entry-preview'||a==='preview'){state.previewName=n||el.dataset.name||'会议纪要.pdf';state.modal='preview';render()}
    else if(a==='entry-folder'||a==='entry-nested'){state.folderName=n;state.modal='folder';render()}
    else if(a==='favorite'){state.favorite=!state.favorite;showToast(state.favorite?'已加入收藏':'已取消收藏');if(state.modal==='quick')state.modal='';render()}
    else if(a==='quick-menu'||a==='more-archive'){state.modal='quick';render()}
    else if(a==='open-folder'){state.folderName=n;state.modal='folder';render()}
    else if(a==='location'){state.locationName=n;state.modal='location';render()}
    else if(a==='locations'||a==='all-files'){state.locationName='全部位置';state.modal='location';render()}
    else if(a==='fake-picker'){state.modal='';showToast('系统 Files 选择器会在原生 App 中打开');}
    else if(a==='toggle-create-item'){let idx=state.createItems.indexOf(n);if(idx>=0)state.createItems.splice(idx,1);else state.createItems.push(n);render()}
    else if(a==='clear-create'){state.createItems=[];render()}
    else if(a==='create-next'){if(state.createItems.length){state.createStep=1;render()}}
    else if(a==='pick-create-destination'){state.modal='create-destination';render()}
    else if(a==='format'){state.createFormat=n;render()}
    else if(a==='level'){state.createLevel=n;render()}
    else if(a==='toggle-create-password'){state.createPassword=!state.createPassword;render()}
    else if(a==='create-submit'){let inp=document.getElementById('create-name');let typed=inp?inp.value.trim():state.createName;let base=typed||'新建压缩包';base=base.replace(/\.(zip|7z)$/i,'');state.createName=base+'.'+state.createFormat.toLowerCase();let pw=document.getElementById('create-password');if(pw)state.createPasswordValue=pw.value;if(state.createPassword&&!state.createPasswordValue){showToast('请输入压缩包密码');return}state.modal='created';render();let task={id:Date.now(),name:state.createName,kind:'压缩',percent:100,paused:false,status:'done',detail:'已创建压缩包',destination:state.createDestination};state.tasks.unshift(task);state.files.unshift({name:state.createName,kind:'zip',meta:state.createFormat+' · 42.6 MB · '+state.createItems.length+' 个项目',date:'刚刚',location:state.createDestination.indexOf('iCloud')===0?'iCloud Drive':'下载'})}
    else if(a==='created-done'){state.modal='';state.page='tasks';state.taskFilter='全部';render()}
    else if(a==='task-filter'){state.taskFilter=n;render()}
    else if(a==='pause-task'){let t=state.tasks.find(function(x){return String(x.id)===el.dataset.id});if(t){t.paused=!t.paused;render()}}
    else if(a==='cancel-task'){let t=state.tasks.find(function(x){return String(x.id)===el.dataset.id});if(t){t.status='cancelled';clearInterval(t.timer);render();showToast('任务已取消，源文件未更改')}}
    else if(a==='retry-task'){let t=state.tasks.find(function(x){return String(x.id)===el.dataset.id});if(t){t.status='running';t.percent=8;t.paused=false;render();runTask(t);showToast('任务已重新加入队列')}}
    else if(a==='open-result'){state.resultId=Number(el.dataset.id);state.modal='result';render()}
    else if(a==='open-task-output'){let t=state.tasks.find(function(x){return x.id===state.resultId});if(t&&t.outputFolder){let existing=state.files.find(function(f){return f.kind==='folder'&&f.name===t.outputFolder&&f.location===t.outputLocation});if(!existing){state.files.unshift({name:t.outputFolder,kind:'folder',meta:'解压结果 · '+(t.entryCount||0)+' 个项目',date:'刚刚',location:t.outputLocation||'下载',children:t.items||[]})}state.folderName=t.outputFolder;state.modal='folder';render()}else if(t){state.locationName=t.destination;state.modal='location';render()}else{state.modal='';render()}}
    else if(a==='toggle-theme'){state.dark=!state.dark;render()}
    else if(a==='toggle-faceid'){el.classList.toggle('on');showToast(el.classList.contains('on')?'Face ID 应用锁已开启':'Face ID 应用锁已关闭')}
    else if(a==='clear-data'){state.tasks=state.tasks.filter(function(t){return t.status==='running'});showToast('最近记录已清除');render()}
    else if(a==='share'){showToast('分享面板会由 iOS 系统提供')}
    else if(a==='quick-menu'){state.modal='quick';render()}
    else if(a==='toggle-theme'){state.dark=!state.dark;render()}
    else if(a==='task-filter'){state.taskFilter=n;render()}
    else if(a==='demo-open'){state.archiveName='课程资料_2026.zip';state.page='archive';state.modal='';render()}
  }
  app.addEventListener('click',function(e){let el=e.target.closest('[data-action]');if(!el||!app.contains(el))return;e.stopPropagation();action(el)});
  document.querySelectorAll('.demo-action').forEach(function(b){b.addEventListener('click',function(){let a=b.dataset.action;if(a==='demo-open')action({dataset:{action:a}});else if(a==='demo-create')action({dataset:{action:a}});else if(a==='tab-tasks')setPage('tasks');else if(a==='toggle-theme'){state.dark=!state.dark;render()}})});
  app.addEventListener('input',function(e){if(e.target.id==='home-search'){state.query=e.target.value;let q=state.query.toLowerCase();document.querySelectorAll('.file-row').forEach(function(row){row.style.display=row.textContent.toLowerCase().indexOf(q)>=0?'flex':'none'})}if(e.target.id==='entry-search'){state.entryQuery=e.target.value;let q=state.entryQuery.toLowerCase();document.querySelectorAll('.entry-row').forEach(function(row){row.style.display=row.textContent.toLowerCase().indexOf(q)>=0?'flex':'none'})}if(e.target.id==='create-name')state.createName=e.target.value;if(e.target.id==='create-password')state.createPasswordValue=e.target.value});
  app.addEventListener('change',function(e){if(e.target.id==='conflict-select')state.conflict=e.target.value});
  render();
})();
</script>
</body>
</html>
