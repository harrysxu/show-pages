<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="color-scheme" content="light" />
    <title>纸间 · iPhone / iPad App 交互原型</title>
    <style>
      :root {
        --accent: #147d68;
        --accent-soft: #e5f3ed;
        --ink: #243430;
        --muted: #81908a;
        --line: #e7ece9;
        --bg: #f7f9f7;
        --paper: #fff;
        --danger: #c6514d;
        --blue: #457eac;
        --amber: #ba8441;
        --radius: 8px;
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
          sans-serif;
        color: var(--ink);
        font-synthesis: none;
        letter-spacing: 0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #e9eeec;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
        border: 0;
        color: inherit;
        background: none;
        touch-action: manipulation;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.36;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 3px solid #76bba9;
        outline-offset: 2px;
      }
      button svg {
        pointer-events: none;
      }
      svg {
        width: 20px;
        height: 20px;
        stroke-width: 1.75;
        flex-shrink: 0;
      }
      input,
      select,
      textarea {
        min-width: 0;
        color: var(--ink);
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 8px;
        outline: none;
      }
      input[type="text"],
      input[type="password"],
      input[type="number"],
      select {
        padding: 10px 11px;
        height: 42px;
        width: 100%;
        font-size: 13px;
      }
      input[type="range"] {
        accent-color: var(--accent);
        width: 100%;
        height: 22px;
        border: 0;
        padding: 0;
      }
      input[type="checkbox"] {
        accent-color: var(--accent);
        width: 17px;
        height: 17px;
      }
      textarea {
        width: 100%;
        padding: 12px;
        line-height: 1.8;
        resize: vertical;
        font-size: 13px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 25px;
        font-weight: 680;
        line-height: 1.35;
      }
      h2 {
        font-size: 16px;
        font-weight: 650;
      }
      h3 {
        font-size: 14px;
        font-weight: 650;
      }
      p {
        font-size: 13px;
        line-height: 1.7;
      }
      small {
        font-size: 11px;
        color: var(--muted);
      }
      a {
        color: var(--accent);
      }
      .hide {
        display: none !important;
      }
      .muted {
        color: var(--muted);
      }
      .accent {
        color: var(--accent);
      }
      .danger {
        color: var(--danger);
      }
      .nowrap {
        white-space: nowrap;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .between {
        justify-content: space-between;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 5px;
        min-width: 0;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .truncate {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .icon-btn {
        width: 44px;
        height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        flex-shrink: 0;
      }
      .icon-btn:hover {
        background: var(--accent-soft);
      }
      .icon-btn.active {
        color: var(--accent);
        background: var(--accent-soft);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 44px;
        padding: 10px 16px;
        font-size: 13px;
        font-weight: 600;
        border-radius: 8px;
        white-space: normal;
        line-height: 1.5;
      }
      .btn svg {
        width: 17px;
        height: 17px;
      }
      .btn.primary {
        background: var(--accent);
        color: #fff;
      }
      .btn.secondary {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .btn.outline {
        border: 1px solid var(--line);
        background: var(--paper);
      }
      .btn.destructive {
        background: var(--danger);
        color: white;
      }
      .btn.full {
        width: 100%;
      }
      .btn.small {
        min-height: 32px;
        padding: 6px 10px;
        font-size: 11px;
      }
      .text-btn {
        font-size: 12px;
        font-weight: 600;
        color: var(--accent);
        padding: 6px 0;
        display: inline-flex;
        gap: 5px;
        align-items: center;
      }
      .text-btn svg {
        width: 13px;
        height: 13px;
      }
      .tag {
        font-size: 10px;
        font-weight: 600;
        padding: 4px 7px;
        border-radius: 4px;
        background: var(--accent-soft);
        color: var(--accent);
        white-space: nowrap;
      }
      .tag.amber {
        background: #fcf1de;
        color: var(--amber);
      }
      .tag.gray {
        background: #eff2ef;
        color: var(--muted);
      }
      .divider {
        height: 1px;
        background: var(--line);
        margin: 14px 0;
      }
      .note {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.6;
      }
      .note svg {
        width: 14px;
        height: 14px;
        color: var(--accent);
      }
      .section-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 24px 0 13px;
      }
      .section-label small {
        font-size: 11px;
      }
      .field {
        margin: 15px 0;
      }
      .field label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 9px;
      }
      .field label output {
        font-size: 11px;
        font-weight: 500;
        color: var(--accent);
      }
      .check-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 13px 0;
        font-size: 13px;
        border-bottom: 1px solid var(--line);
      }
      .check-row:last-child {
        border-bottom: 0;
      }
      .switch {
        position: relative;
        width: 39px;
        height: 24px;
        display: inline-block;
        flex-shrink: 0;
      }
      .switch input {
        opacity: 0;
        width: 100%;
        height: 100%;
        position: absolute;
        inset: 0;
        margin: 0;
        cursor: pointer;
        z-index: 2;
      }
      .switch span {
        position: absolute;
        inset: 0;
        background: #dfe7e2;
        border-radius: 20px;
        transition: 0.2s;
      }
      .switch span:after {
        content: "";
        position: absolute;
        left: 3px;
        top: 3px;
        width: 18px;
        height: 18px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 1px 3px #0002;
        transition: 0.2s;
      }
      .switch input:checked + span {
        background: var(--accent);
      }
      .switch input:checked + span:after {
        transform: translateX(15px);
      }
      .switch input:focus-visible + span {
        outline: 3px solid #76bba9;
        outline-offset: 3px;
      }
      .segmented {
        display: flex;
        background: #eef2ef;
        padding: 3px;
        border-radius: 8px;
        gap: 3px;
      }
      .segmented button {
        flex: 1;
        font-size: 12px;
        font-weight: 600;
        border-radius: 6px;
        min-height: 33px;
        padding: 5px 8px;
        white-space: nowrap;
      }
      .segmented button.selected {
        background: var(--paper);
        box-shadow: 0 1px 4px #25383012;
        color: var(--accent);
      }
      .previewbar {
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 32px;
        border-bottom: 1px solid #dbe2dd;
        background: #f5f7f5;
        gap: 16px;
      }
      .preview-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        font-weight: 650;
      }
      .preview-brand .mark {
        background: var(--accent);
        color: #fff;
        width: 30px;
        height: 30px;
        border-radius: 7px;
        display: grid;
        place-items: center;
      }
      .preview-brand svg {
        width: 17px;
      }
      .preview-brand small {
        padding-left: 10px;
        border-left: 1px solid #dbe2dd;
        font-weight: 400;
      }
      .preview-controls {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .preview-controls .segmented button {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 90px;
        justify-content: center;
        font-size: 11px;
      }
      .preview-controls .segmented svg {
        width: 15px;
        height: 15px;
      }
      .preview-info {
        display: flex;
        gap: 7px;
        align-items: center;
        font-size: 11px;
        color: var(--muted);
      }
      .preview-info .dot {
        width: 6px;
        height: 6px;
        background: var(--accent);
        border-radius: 50%;
      }
      .stage {
        min-height: calc(100dvh - 64px);
        padding: 24px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        background-image: radial-gradient(#acbdb233 0.7px, transparent 0.7px);
        background-size: 15px 15px;
      }
      .device {
        position: relative;
        width: 410px;
        height: 844px;
        max-height: calc(100dvh - 110px);
        min-height: 640px;
        background: var(--paper);
        border: 7px solid #28332f;
        border-radius: 44px;
        box-shadow:
          0 26px 55px #25373024,
          0 3px 6px #25373016;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        isolation: isolate;
      }
      .device:before {
        content: "";
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        width: 112px;
        height: 26px;
        background: #17221d;
        border-radius: 30px;
        z-index: 10;
      }
      .statusbar {
        height: 48px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 15px 25px 0;
        font-size: 11px;
        font-weight: 650;
        background: var(--paper);
      }
      .statusbar .row {
        gap: 4px;
      }
      .statusbar svg {
        width: 13px;
        height: 13px;
        stroke-width: 2;
      }
      .app-layout {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      .sidebar {
        display: none;
        width: 215px;
        background: #f6f8f6;
        flex-shrink: 0;
        border-right: 1px solid var(--line);
        padding: 22px 14px;
        overflow: auto;
      }
      .side-brand {
        font-size: 24px;
        font-weight: 700;
        display: flex;
        gap: 9px;
        align-items: center;
        padding: 4px 9px 20px;
      }
      .side-brand svg {
        color: var(--accent);
        width: 26px;
        height: 26px;
      }
      .side-group {
        font-size: 10px;
        color: var(--muted);
        padding: 17px 12px 7px;
      }
      .side-item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 10px 12px;
        margin: 2px 0;
        border-radius: 7px;
        font-size: 12px;
        text-align: left;
      }
      .side-item svg {
        width: 17px;
        height: 17px;
        color: #788980;
      }
      .side-item.active {
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 600;
      }
      .side-item.active svg {
        color: var(--accent);
      }
      .sidebar .privacy-foot {
        margin-top: 22px;
        padding: 12px;
        font-size: 10px;
        line-height: 1.7;
        color: var(--muted);
        border-top: 1px solid var(--line);
      }
      .app-main {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
        min-height: 0;
        background: var(--paper);
      }
      .app-header {
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 18px;
        flex-shrink: 0;
        border-bottom: 1px solid var(--line);
      }
      .app-header .title {
        font-size: 16px;
        font-weight: 650;
      }
      .app-header .sub {
        font-size: 10px;
        color: var(--muted);
        margin-top: 3px;
      }
      .app-header .avatar {
        height: 29px;
        width: 29px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #e9ede9;
        font-size: 11px;
        font-weight: 600;
      }
      .content {
        overflow: auto;
        overscroll-behavior: contain;
        flex: 1;
        min-height: 0;
        scrollbar-width: thin;
        scrollbar-color: #cad8ce transparent;
      }
      .page {
        padding: 22px 20px 25px;
        min-height: 100%;
      }
      .eyebrow {
        font-size: 10px;
        color: var(--muted);
        margin-bottom: 7px;
        font-weight: 500;
      }
      .page-intro {
        margin-bottom: 20px;
      }
      .page-intro h1 {
        font-size: 23px;
      }
      .page-intro p {
        font-size: 11px;
        color: var(--muted);
        margin-top: 6px;
      }
      .tabbar {
        display: flex;
        height: 67px;
        padding: 7px 12px 15px;
        background: var(--paper);
        border-top: 1px solid var(--line);
        flex-shrink: 0;
      }
      .tabbar button {
        flex: 1;
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 5px;
        color: #95a299;
        font-size: 9px;
        font-weight: 500;
      }
      .tabbar svg {
        width: 21px;
        height: 21px;
      }
      .tabbar button.active {
        color: var(--accent);
      }
      .home-indicator {
        position: absolute;
        width: 118px;
        height: 4px;
        background: #17221d;
        border-radius: 5px;
        bottom: 5px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 15;
      }
      .tablet.device {
        width: 1120px;
        height: 810px;
        max-height: calc(100dvh - 110px);
        min-height: 630px;
        border-radius: 25px;
        border-width: 8px;
      }
      .tablet.device:before {
        width: 6px;
        height: 6px;
        top: 6px;
        border-radius: 50%;
        background: #0c1511;
      }
      .tablet .statusbar {
        height: 27px;
        padding: 5px 23px 0;
        font-size: 10px;
      }
      .tablet .sidebar {
        display: block;
      }
      .tablet .tabbar {
        display: none;
      }
      .tablet .app-header {
        height: 62px;
        padding: 12px 27px;
      }
      .tablet .page {
        padding: 26px 30px;
      }
      .tablet .home-grid {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 28px;
      }
      .tablet .editor-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 250px;
        gap: 24px;
        align-items: start;
      }
      .tablet .editor-layout .inspector {
        margin-top: 0;
      }
      .tablet .page-intro h1 {
        font-size: 25px;
      }
      .tablet .home-indicator {
        width: 150px;
      }
      .tablet .tool-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .tablet .file-item {
        padding: 15px 0;
      }
      .tablet .page-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .tablet .form-list {
        max-width: 550px;
      }
      .tablet .sheet {
        max-width: 450px;
        margin: 0 auto;
        border-radius: 14px;
      }
      .tablet .overlay {
        padding: 35px;
        align-items: center;
      }
      .tablet .ocr-columns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px;
      }
      .workspace-welcome {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 15px;
        margin-bottom: 22px;
      }
      .workspace-welcome h1 {
        font-size: 26px;
      }
      .workspace-welcome .date {
        font-size: 10px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .welcome-icon {
        width: 44px;
        height: 48px;
        background: #f7eded;
        color: var(--danger);
        border: 1px solid #f0dfdc;
        border-radius: 7px;
        display: grid;
        place-items: center;
      }
      .welcome-icon svg {
        width: 25px;
        height: 25px;
      }
      .import-strip {
        background: #e9f4ed;
        padding: 16px;
        border-radius: 8px;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 13px;
      }
      .import-strip .import-icon {
        width: 39px;
        height: 39px;
        border: 1px solid #caddcf;
        border-radius: 8px;
        color: var(--accent);
        display: grid;
        place-items: center;
        background: #f5faf6;
      }
      .import-strip h2 {
        font-size: 14px;
      }
      .import-strip p {
        font-size: 10px;
        color: #739183;
        margin-top: 3px;
      }
      .import-strip > .icon-btn {
        background: var(--accent);
        color: white;
        width: 33px;
        height: 33px;
      }
      .task-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .task-card {
        min-height: 99px;
        border: 1px solid var(--line);
        padding: 14px;
        border-radius: 8px;
        text-align: left;
        background: var(--paper);
      }
      .task-card .tool-icon {
        width: 30px;
        height: 30px;
        border-radius: 7px;
        background: var(--accent-soft);
        color: var(--accent);
        display: grid;
        place-items: center;
        margin-bottom: 10px;
      }
      .task-card .tool-icon svg {
        width: 18px;
        height: 18px;
      }
      .task-card:nth-child(2) .tool-icon {
        background: #eaf0f8;
        color: var(--blue);
      }
      .task-card:nth-child(3) .tool-icon {
        background: #fcf1de;
        color: var(--amber);
      }
      .task-card:nth-child(4) .tool-icon {
        background: #f8eae8;
        color: var(--danger);
      }
      .task-card strong {
        font-size: 12px;
        font-weight: 600;
      }
      .task-card small {
        font-size: 10px;
        display: block;
        margin-top: 4px;
      }
      .file-item {
        display: flex;
        gap: 11px;
        align-items: center;
        min-height: 66px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
        width: 100%;
        text-align: left;
        background: transparent;
      }
      .file-item:last-child {
        border-bottom: 0;
      }
      .file-cover {
        width: 34px;
        height: 42px;
        flex-shrink: 0;
        object-fit: cover;
        border-radius: 3px;
        border: 1px solid #e4e8e5;
        box-shadow: 1px 2px 3px #263c2c0b;
        background: white;
      }
      .file-item .filename {
        font-size: 12px;
        font-weight: 550;
        line-height: 1.5;
      }
      .file-item .file-meta {
        font-size: 10px;
        color: var(--muted);
        margin-top: 4px;
      }
      .file-item > .icon-btn {
        width: 27px;
        height: 29px;
      }
      .file-item > .icon-btn svg {
        width: 17px;
        height: 17px;
      }
      .file-item .file-status {
        font-size: 9px;
        color: var(--accent);
      }
      .file-item .selection {
        color: var(--accent);
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }
      .continue-band {
        background: #f4f6f3;
        border-left: 2px solid #a8bfac;
        padding: 12px 13px;
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 22px;
      }
      .continue-band svg {
        width: 18px;
        height: 18px;
        color: var(--accent);
      }
      .continue-band strong {
        font-size: 11px;
      }
      .continue-band p {
        font-size: 10px;
        color: var(--muted);
        margin-top: 4px;
      }
      .searchbar {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line);
        background: var(--bg);
        padding: 0 10px;
        border-radius: 8px;
        margin-bottom: 14px;
      }
      .searchbar svg {
        width: 15px;
        height: 15px;
        color: var(--muted);
      }
      .searchbar input {
        border: 0;
        background: transparent;
        height: 39px;
        padding: 8px 0;
        flex: 1;
        font-size: 12px;
      }
      .filter-row {
        display: flex;
        align-items: center;
        gap: 5px;
        margin: 13px 0 6px;
      }

        )}<div class="field"><label>字号 <output id="number-size">${n.size} pt</output></label><input type="range" min="8" max="20" data-bind="numbers.size" value="${n.size}"></div>${switchRow("跳过封面", "numbers.skip", n.skip)}${switchRow("奇偶页镜像排列", "numbers.oddEven", n.oddEven)}<div class="row">${field("从第几页", `<input type="number" min="1" max="${current().pages.length}" data-bind="numbers.from" value="${n.from}">`)}${field("到第几页", `<input type="number" min="1" max="${current().pages.length}" data-bind="numbers.to" value="${Math.min(n.to, current().pages.length)}">`)}</div><div class="footer-actions">${button("导出带页码的 PDF", "numbers-export", "share")}${button("保存为模板", "save-template", "copy-check", "outline")}</div></div></div></div>`;
      }
      function watermarkView() {
        const w = state.watermark;
        return `<div class="page">${fileBanner()}<div class="editor-layout"><div><div class="paper-stage">${paperImage()}</div></div><div class="inspector"><div class="segmented"><button data-watermark-type="text" class="${w.type === "text" ? "selected" : ""}">文字</button><button data-watermark-type="image" class="${w.type === "image" ? "selected" : ""}">图片</button></div>${w.type === "text" ? field("水印内容", `<input type="text" data-bind="watermark.text" value="${esc(w.text)}" placeholder="输入文字">`) : `<div class="field">${button("选择水印图片", "watermark-image", "image-plus", "secondary")}</div>`}<div class="field"><label>透明度 <output id="watermark-opacity">${w.opacity}%</output></label><input type="range" min="5" max="80" value="${w.opacity}" data-bind="watermark.opacity"></div><div class="field"><label>旋转角度 <output id="watermark-angle">${w.angle}°</output></label><input type="range" min="-75" max="75" value="${w.angle}" data-bind="watermark.angle"></div><div class="field"><label>字号 / 尺寸 <output id="watermark-size">${w.size} pt</output></label><input type="range" min="12" max="55" value="${w.size}" data-bind="watermark.size"></div><div class="field"><label>颜色</label><div class="row">${["#147d68", "#457eac", "#c6514d", "#535e57"].map((c) => `<button class="swatch ${w.color === c ? "selected" : ""}" style="background:${c}" data-watermark-color="${c}" title="颜色 ${c}"></button>`).join("")}</div></div>${switchRow("重复平铺", "watermark.tile", w.tile)}${switchRow("水印覆盖在页面上方", "watermark.foreground", w.foreground)}${field("应用范围", `<select data-bind="watermark.range"><option value="all" ${w.range === "all" ? "selected" : ""}>全部页面</option><option value="current" ${w.range === "current" ? "selected" : ""}>当前页面</option></select>`)}<div class="footer-actions">${button("导出带水印的 PDF", "watermark-export", "share")}${button("保存为模板", "save-template", "copy-check", "outline")}</div></div></div></div>`;
      }
      function templatesView() {
        return `<div class="page">${intro("文档模板", `${state.templates.length} 个模板 · 仅保存处理参数`)}${state.templates.map((t) => `<div class="template-item ${state.chosenTemplate === t.id ? "active" : ""}"><button class="row" data-template="${t.id}" style="width:100%;padding:0;text-align:left"><span class="template-icon">${icon(t.type === "receipt" ? "receipt-text" : t.type === "report" ? "notebook-tabs" : "file-check-2")}</span><span class="grow"><h3>${esc(t.name)}</h3><p>${esc(t.detail)}</p></span>${icon(state.chosenTemplate === t.id ? "circle-check" : "circle")}</button><div class="row between"><span class="tag gray">A4 · ${t.compress === "light" ? "高清" : "平衡"}输出</span><div class="row"><button class="text-btn" data-action="edit-template" data-id="${t.id}">编辑</button><button class="icon-btn" data-action="delete-template" data-id="${t.id}" title="删除模板">${icon("trash-2")}</button></div></div></div>`).join("")}<div class="footer-actions">${button("应用到当前文件", "apply-template", "check")}${button("保存当前参数为模板", "save-template", "plus", "outline")}<span class="note">${icon("shield-check")}模板不保存文件、签名或 OCR 内容</span></div></div>`;
      }
      function shortcutsView() {
        return `<div class="page">${intro("快捷指令", "", "文件任务自动化")}${section("选择动作")}<div class="tool-grid">${[
          ["compress", "压缩 PDF", "minimize-2"],
          ["merge", "合并文件", "combine"],
          ["ocr", "识别并提取文字", "scan-text"],
          ["rename", "重命名文件", "text-cursor-input"],
        ]
          .map(
            ([id, title, symbol]) =>
              `<button class="tool-item" data-shortcut="${id}"><span class="tool-symbol">${icon(symbol)}</span><span class="grow"><strong>${title}</strong></span>${state.shortcut === id ? icon("circle-check") : ""}</button>`,
          )
          .join(
            "",
          )}</div>${section("工作流")}<div class="shortcut-flow"><div class="shortcut-step">${icon("file-input")}<strong>接收文件</strong><small>Files / 分享菜单</small></div>${icon("arrow-right")}<div class="shortcut-step">${icon("workflow")}<strong>${{ compress: "压缩 PDF", merge: "合并文件", ocr: "文字识别", rename: "重命名文件" }[state.shortcut]}</strong><small>在本机处理</small></div>${icon("arrow-right")}<div class="shortcut-step">${icon("file-output")}<strong>保存副本</strong><small>选择导出位置</small></div></div>${fileBanner()}${switchRow("运行前确认文件", "settings.confirmInput", state.settings.confirmInput !== false)}${switchRow("完成后选择保存位置", "settings.confirmOutput", state.settings.confirmOutput !== false)}<div class="footer-actions">${button("试运行工作流", "shortcut-run", "play")}${button("添加到快捷指令", "shortcut-add", "plus", "outline")}<span class="tag gray" style="align-self:flex-start">快捷指令与分享扩展为流程演示</span></div></div>`;
      }
      function proView() {
        return `<div class="page"><div class="pro-heading"><div class="pro-logo">${icon("crown")}</div><h1>纸间 Pro</h1><p>${state.pro ? "你的完整工作台，已经就绪" : "一次买断，文件工作更从容"}</p></div>${[
          ["scan-text", "无限扫描与 OCR", "中文与英文 · 设备端处理"],
          ["list-checks", "批处理与快捷指令", "重复工作，一次完成"],
          ["signature", "高级签名与安全打码", "完整签署 · 敏感信息移除"],
          ["shield-check", "密码、模板与水印", "保护文件 · 固定处理格式"],
          ["download", "无水印导出 · 家庭共享", "清晰的文件 · 清晰的权益"],
        ]
          .map(
            ([s, t, p]) =>
              `<div class="benefit">${icon(s)}<div class="grow"><strong>${t}</strong><p>${p}</p></div>${icon("check")}</div>`,
          )
          .join(
            "",
          )}<div class="plan active"><span class="plan-radio">${icon("circle-check")}</span><div class="grow"><h3>永久买断 <span class="tag">推荐</span></h3><small>一次付款，无自动续订</small></div><strong>¥68</strong></div>${button(state.pro ? "已解锁 Pro" : "解锁纸间 Pro", "buy-pro", "crown", "primary", state.pro ? "disabled" : "")}<button class="text-btn" data-action="restore-pro" style="display:flex;justify-content:center;width:100%;padding:15px">恢复购买</button><div class="note" style="justify-content:center">${icon("info")}App Store 购买为演示，不会产生费用</div><div class="row between" style="margin-top:25px"><button class="text-btn muted" data-action="privacy">隐私政策</button><button class="text-btn muted" data-action="terms">使用条款</button></div></div>`;
      }
      function settingsView() {
        const s = state.settings;
        return `<div class="page">${intro("设置", "", "文件、隐私与使用偏好")}<div class="settings-group">${switchRow("深色外观", "settings.dark", s.dark)}${switchRow("优先保存到本机", "settings.keepLocal", s.keepLocal)}${switchRow("扫描后自动 OCR", "settings.autoOCR", s.autoOCR)}<div class="settings-row">${icon("minimize-2")}<span class="grow"><strong>默认压缩级别</strong></span><select data-bind="settings.compression">${[
          ["light", "轻度"],
          ["balanced", "平衡"],
          ["strong", "强力"],
        ]
          .map(
            ([id, t]) =>
              `<option value="${id}" ${s.compression === id ? "selected" : ""}>${t}</option>`,
          )
          .join(
            "",
          )}</select></div><div class="settings-row">${icon("languages")}<span class="grow"><strong>默认 OCR 语言</strong></span><select data-bind="settings.language">${[
          ["zh-en", "中文 + English"],
          ["tw-en", "繁中 + English"],
          ["en", "English"],
        ]
          .map(
            ([id, t]) =>
              `<option value="${id}" ${s.language === id ? "selected" : ""}>${t}</option>`,
          )
          .join(
            "",
          )}</select></div><div class="settings-row">${icon("history")}<span class="grow"><strong>最近记录保留</strong></span><select data-bind="settings.retention">${["30 天", "90 天", "永久"].map((t) => `<option ${t === s.retention ? "selected" : ""}>${t}</option>`).join("")}</select></div></div>${section("本地数据")}<button class="settings-row" data-action="clear-cache">${icon("hard-drive")}<span class="grow"><strong>清理缓存</strong><small>保留最近文件与签名</small></span>${icon("chevron-right")}</button><button class="settings-row" data-action="clear-history">${icon("trash-2")}<span class="grow"><strong>清除最近记录</strong><small>不删除系统文件中的原件</small></span>${icon("chevron-right")}</button><button class="settings-row" data-action="privacy">${icon("shield-check")}<span class="grow"><strong>隐私与权限</strong></span>${icon("chevron-right")}</button><button class="settings-row" data-action="about">${icon("info")}<span class="grow"><strong>关于纸间</strong><small>1.0 · App 原型</small></span>${icon("chevron-right")}</button><div class="note" style="justify-content:center;margin-top:28px">${icon("leaf")}无需账号，文件不上传</div></div>`;
      }
      const renderers = {
        home: homeView,
        files: filesView,
        tools: toolsView,
        scan: scanView,
        reader: readerView,
        organize: organizeView,
        compress: compressView,
        sign: signView,
        ocr: ocrView,
        redact: redactView,
        batch: batchView,
        protect: protectView,
        numbers: numbersView,
        watermark: watermarkView,
        templates: templatesView,
        shortcuts: shortcutsView,
        pro: proView,
        settings: settingsView,
        personal: personalView,
      };
      /* Document assets, operations, and interaction controllers are below. */
      //__CONTROLLERS__
    </script>
  </body>
</html>
